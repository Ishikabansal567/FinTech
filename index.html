<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .custom-btn {
      background-color: #3B82F6;
    }

    .custom-btn:hover {
      background-color: #2563EB;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-2xl">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">🧾 Financial Onboarding</h2>

    <form id="multiStepForm">
      <!-- Step 1 -->
      <div class="step active" id="step-1">
        <h3 class="text-lg font-semibold text-gray-700 mb-4">Step 1: Basic Financial Profile</h3>

        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Monthly Income (₹)</label>
          <input type="input"
            class="w-full mt-1 p-3 border rounded-xl border-gray-300 focus:ring focus:ring-blue-400 focus:outline-none">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 font-medium mb-1">Fixed Expenses </label>
          <input type="text" placeholder="Rent" class="w-full mb-2 p-3 border rounded-xl border-gray-300">
          <input type="text" placeholder="EMIs / Loans" class="w-full mb-2 p-3 border rounded-xl border-gray-300">
          <input type="text" placeholder="Subscriptions" class="w-full p-3 border rounded-xl border-gray-300">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Savings Goal </label>
          <input type="input" placeholder="e.g., 5000"
            class="w-full mt-1 p-3 border rounded-xl border-gray-300">
        </div>

        <button type="button" onclick="nextStep()"
          class="custom-btn text-white px-6 py-2 rounded-xl transition w-full mt-4">Next</button>
      </div>

      <!-- Step 2 -->
      <div class="step" id="step-2">
        <h3 class="text-lg font-semibold text-gray-700 mb-4">Step 2: Preferred Category Budget Limits</h3>
        <p class="text-sm text-gray-500 mb-4">Set your budget limit for each spending category </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-medium">Food & Dining (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
          <div>
            <label class="block text-gray-700 font-medium">Transport (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
          <div>
            <label class="block text-gray-700 font-medium">Shopping (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
          <div>
            <label class="block text-gray-700 font-medium">Education (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
          <div>
            <label class="block text-gray-700 font-medium">Entertainment (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
          <div>
            <label class="block text-gray-700 font-medium">Utilities (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
          <div>
            <label class="block text-gray-700 font-medium">Travel (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
          <div>
            <label class="block text-gray-700 font-medium">Others (₹)</label>
            <input type="input" class="w-full mt-1 p-3 border rounded-xl border-gray-300">
          </div>
        </div>

        <div class="flex justify-between mt-6">
          <button type="button" onclick="prevStep()"
            class="bg-gray-300 text-gray-700 px-6 py-2 rounded-xl hover:bg-gray-400 transition">Back</button>
          <button type="submit"
            class="custom-btn text-white px-6 py-2 rounded-xl transition">Finish</button>
        </div>
      </div>
    </form>
  </div>

  <script>
    let currentStep = 1;

    function showStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');
    }

    function nextStep() {
      if (currentStep < 2) {
        currentStep++;
        showStep(currentStep);
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        showStep(currentStep);
      }
    }

    document.getElementById("multiStepForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("🎉 Onboarding Complete! Thank you.");
    });
  </script>
</body>

</html>
